[workspace]
resolver = "2"
members = ["crates/ikt-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
incremental = true

# RSA / AES / 哈希这些依赖在 debug 下是纯算力活，关掉优化会慢一个数量级。
# 只给依赖开 O2，自己的 crate 仍然保留快速编译。
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
